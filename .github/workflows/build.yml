name: Build APK

on:
  push:
    branches: [ main, ci, test ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  # Preferred SDK variable with fallback
  ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME || '/usr/local/android-sdk' }}

jobs:
  build:
    runs-on: ubuntu-latest
    
    # Explicit permissions for v4 actions
    permissions:
      contents: read
      packages: read
    
    strategy:
      matrix:
        api-level: [34]
        build-tools: ['34.0.0']
    
    steps:
      # ===== 1. Checkout with v4 =====
      - name: Checkout Code
        uses: actions/checkout@v4.1.1  # Pinned version for stability
        with:
          fetch-depth: 1  # Faster clone
      
      # ===== 2. JDK Setup with v4 =====
      - name: Set up JDK 17
        uses: actions/setup-java@v4.2.1
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      
      # ===== 3. Android SDK Setup with explicit inputs =====
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3.2.0
        with:
          api-level: ${{ matrix.api-level }}
          build-tools: ${{ matrix.build-tools }}
          platforms: >-
            android-34
          cmdline-tools-version: 'latest'
      
      # ===== 4. Diagnostic: Check SDK paths =====
      - name: Debug - Check SDK Paths
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
          echo "ANDROID_SDK: $ANDROID_SDK"
          ls -la $ANDROID_HOME || echo "ANDROID_HOME not found"
          ls -la $ANDROID_SDK_ROOT || echo "ANDROID_SDK_ROOT not found"
      
      # ===== 5. Safe local.properties creation =====
      - name: Create local.properties
        run: |
          # Prefer ANDROID_SDK_ROOT, fallback to ANDROID_HOME
          SDK_DIR="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          
          # Validate SDK directory
          if [ -z "$SDK_DIR" ]; then
            echo "❌ ERROR: ANDROID_SDK_ROOT and ANDROID_HOME are not set!"
            exit 1
          fi
          
          if [ ! -d "$SDK_DIR" ]; then
            echo "❌ ERROR: SDK directory does not exist: $SDK_DIR"
            exit 1
          fi
          
          # Backup existing local.properties if present
          if [ -f local.properties ]; then
            echo "⚠️  local.properties exists, backing up to local.properties.bak"
            cp local.properties local.properties.bak
          fi
          
          # Create new local.properties
          printf "sdk.dir=%s\n" "$SDK_DIR" > local.properties
          echo "✅ local.properties created with SDK: $SDK_DIR"
      
      # ===== 6. Make gradlew executable =====
      - name: Make Gradlew Executable
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            echo "✅ gradlew is executable"
          else
            echo "❌ ERROR: gradlew not found!"
            exit 1
          fi
      
      # ===== 7. Cache Gradle dependencies =====
      - name: Cache Gradle
        uses: actions/cache@v3.3.2
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      
      # ===== 8. Build APK =====
      - name: Build APK
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace
      
      # ===== 9. Diagnostic: List generated files =====
      - name: Debug - List Build Outputs
        run: |
          echo "=== Build Outputs ==="
          ls -R app/build/outputs/apk/ || echo "No APK found"
          ls -R app/build/outputs/ || echo "No build outputs"
      
      # ===== 10. Upload APK (v4 with explicit name) =====
      - name: Upload APK
        uses: actions/upload-artifact@v4.3.1
        with:
          name: app-release-${{ matrix.api-level }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      
      # ===== 11. (Optional) Upload mapping file =====
      - name: Upload ProGuard Mapping
        uses: actions/upload-artifact@v4.3.1
        if: always()
        with:
          name: proguard-mapping-${{ matrix.api-level }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 14
